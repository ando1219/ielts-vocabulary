<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思单词分类背诵</title>
<style>
*{box-sizing:border-box}
:root{--blue:#2563eb;--blue-hover:#1d4ed8;--blue-soft:#eff6ff;--text:#172033;--muted:#718096;--line:#e2e8f0;--bg:#f4f7fb;--card:#fff;--success:#16a34a;--danger:#dc2626;--shadow:0 18px 55px rgba(15,23,42,.09)}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;padding:34px 20px}.container{width:min(1040px,100%);margin:auto}
.brand{text-align:center}.brand h1{margin:0;font-size:clamp(30px,5vw,52px);line-height:1.15;font-weight:800}.brand p{margin:14px 0 0;color:var(--muted);font-size:15px}
.home{padding-top:30px}.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:46px}
.theme-card{position:relative;min-height:315px;padding:34px;border:1px solid #e5eaf1;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-align:left;transition:transform .2s,box-shadow .2s,border-color .2s}
.theme-card:hover{transform:translateY(-4px);border-color:#bfdbfe;box-shadow:0 24px 65px rgba(37,99,235,.12)}
.theme-icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);font-size:30px;margin-bottom:20px}
.theme-card h2{margin:0;font-size:27px}.theme-card .count{margin:7px 0 0;color:var(--muted);font-size:14px}
.theme-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:22px}
.theme-stat{padding:10px 6px;border-radius:10px;background:#f8fafc;text-align:center}
.theme-stat-value{display:block;color:#334155;font-size:17px;font-weight:800;line-height:1.25}
.theme-stat-label{display:block;margin-top:4px;color:#94a3b8;font-size:11px}
.theme-progress{height:7px;margin-top:15px;border-radius:999px;background:#e8eef6;overflow:hidden}
.theme-progress-bar{height:100%;width:0;border-radius:999px;background:var(--blue);transition:width .25s ease}
.theme-card .start{position:absolute;right:28px;bottom:25px;color:var(--blue);font-size:14px;font-weight:700}
.saved-progress{position:absolute;left:34px;bottom:24px;padding:0;color:#64748b;font-size:12px}
@media(max-width:700px){.theme-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.theme-card{min-height:340px;padding:26px}.theme-card .start{right:24px;bottom:24px}.saved-progress{left:26px;bottom:25px}}
#authView{width:min(460px,100%);margin:0 auto;padding-top:70px}.auth-card{background:#fff;border:1px solid #e5eaf1;border-radius:22px;box-shadow:var(--shadow);padding:34px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f5f9;padding:5px;border-radius:12px;margin-bottom:24px}.auth-tab{border:0;background:transparent;padding:10px;border-radius:9px;color:#64748b;font-weight:700}.auth-tab.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(15,23,42,.08)}.auth-title{margin:0;text-align:center;font-size:28px}.auth-subtitle{margin:8px 0 25px;text-align:center;color:var(--muted);font-size:14px}.auth-field{margin-top:14px;text-align:left}.auth-field label{display:block;margin-bottom:7px;color:#475569;font-size:13px;font-weight:700}.auth-field input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 13px;outline:none}.auth-field input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.08)}.auth-action{width:100%;margin-top:20px;border:0;border-radius:10px;padding:12px;background:var(--blue);color:#fff;font-weight:750}.auth-action:disabled{opacity:.6;cursor:not-allowed}.auth-note{margin-top:15px;color:#64748b;font-size:12px;line-height:1.7;text-align:center}.auth-error{min-height:20px;margin-top:12px;color:var(--danger);font-size:13px;text-align:center}.account-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:16px;color:#64748b;font-size:13px}.account-email{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logout-btn{border:1px solid var(--line);background:#fff;color:#64748b;border-radius:9px;padding:7px 10px;font-size:12px}.logout-btn:hover{border-color:#bfdbfe;color:var(--blue)}.sync-status{font-size:12px;color:#94a3b8;text-align:center;margin-top:12px}.hidden{display:none!important}
.practice-page{width:min(760px,100%);margin:auto}.practice-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.back-btn,.theme-switch{border:1px solid var(--line);background:#fff;color:#526176;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:650}
.back-btn:hover,.theme-switch:hover{border-color:#bfdbfe;color:var(--blue)}
.theme-switch-wrap{position:relative}.theme-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;display:none;min-width:190px;max-height:330px;overflow:auto;padding:7px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 15px 35px rgba(15,23,42,.12)}
.theme-menu.open{display:block}.theme-option{width:100%;border:0;background:transparent;border-radius:8px;padding:10px 12px;text-align:left;color:#475569}.theme-option:hover{background:#f1f5f9}.theme-option.active{background:var(--blue-soft);color:var(--blue);font-weight:700}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:48px 30px;min-height:610px;display:flex;align-items:center;justify-content:center}
.practice,.complete{width:min(470px,100%);text-align:center}.progress{color:var(--muted);font-size:14px;font-weight:650;margin-bottom:30px}
.word{margin:0;font-size:clamp(40px,7vw,58px);line-height:1.15;font-weight:850;letter-spacing:-.025em;overflow-wrap:anywhere}.phonetic{margin:12px 0 35px;color:#8b95a5;font-size:17px}
.form{display:flex;flex-direction:column;gap:14px}select,input{width:100%;height:50px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:0 14px;font-size:16px;outline:0;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}input::placeholder{color:#a1a9b5}
.submit{height:50px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}.submit:hover{background:var(--blue-hover)}.submit:disabled{opacity:.6;cursor:not-allowed}
.answer{border:0;background:transparent;color:#64748b;text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:5px}.answer:hover{color:var(--blue)}
.complete-icon{width:68px;height:68px;border-radius:50%;background:#dcfce7;color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;font-weight:800}
.complete h2{margin:0 0 28px;font-size:29px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px}.stat{padding:18px 10px;border:1px solid #e8edf3;background:#f8fafc;border-radius:12px}
.stat-value{display:block;color:var(--blue);font-size:25px;font-weight:800;margin-bottom:4px}.stat-label{color:var(--muted);font-size:13px}
.restart{width:100%;height:50px;border:1px solid #bfdbfe;background:var(--blue-soft);color:var(--blue);border-radius:10px;font-weight:700}.restart:hover{background:#dbeafe}
.toast{position:fixed;left:50%;top:50%;z-index:1000;transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;padding:15px 23px;border-radius:11px;color:#fff;font-size:15px;font-weight:700;box-shadow:0 14px 35px rgba(15,23,42,.2);transition:opacity .18s,transform .18s;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast.success{background:#15803d}.toast.error{background:#dc2626}.hidden{display:none!important}
@media(max-width:700px){.app{padding:22px 14px}.theme-grid{grid-template-columns:1fr;gap:15px;margin-top:32px}.theme-card{min-height:205px;padding:26px}.theme-card .start{right:24px;bottom:22px}.card{min-height:560px;padding:38px 20px;border-radius:17px}.practice-header{margin-bottom:14px}.back-btn,.theme-switch{padding:9px 11px}}
</style>
</head>
<body>
<div class="app"><div class="container">
<section id="authView">
<div class="auth-card">
<div class="auth-tabs"><button id="loginTab" class="auth-tab active" type="button">登录</button><button id="registerTab" class="auth-tab" type="button">注册</button></div>
<h1 id="authTitle" class="auth-title">登录账号</h1>
<p id="authSubtitle" class="auth-subtitle">登录后，你的背诵进度会与其他账号完全分开</p>
<form id="authForm">
<div class="auth-field"><label for="authEmail">邮箱</label><input id="authEmail" type="email" autocomplete="email" placeholder="请输入邮箱" required></div>
<div class="auth-field"><label for="authPassword">密码</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="至少 6 位" minlength="6" required></div>
<button id="authSubmit" class="auth-action" type="submit">登录</button>
<div id="authError" class="auth-error"></div>
</form>
<div id="authSetup" class="auth-note"></div>
</div>
</section>

<section id="homeView" class="home hidden">
<div class="account-bar"><span>当前账号：<span id="accountEmail" class="account-email"></span></span><button id="logoutBtn" class="logout-btn" type="button">退出登录</button></div>
<div class="brand"><h1>雅思单词分类背诵</h1><p>选择一个主题开始背诵</p></div>
<div id="themeGrid" class="theme-grid"></div><div id="syncStatus" class="sync-status"></div>
</section>

<section id="practiceView" class="practice-page hidden">
<div class="practice-header">
<button id="backBtn" class="back-btn">← 主题首页</button>
<div class="theme-switch-wrap">
<button id="themeSwitch" class="theme-switch">切换主题⌄</button>
<div id="themeMenu" class="theme-menu"></div>
</div>
</div>
<div class="card">
<section id="questionView" class="practice">
<div id="progress" class="progress"></div>
<h2 id="word" class="word"></h2>
<div id="phonetic" class="phonetic"></div>
<div class="form">
<select id="posSelect" aria-label="选择词性"></select>
<input id="meaningInput" type="text" placeholder="请输入中文意思" autocomplete="off">
<button id="submitBtn" class="submit">提交</button>
<button id="answerBtn" class="answer">查看答案</button>
</div>
</section>

<section id="completeView" class="complete hidden">
<div class="complete-icon">✓</div><h2>本分类练习完成</h2>
<div class="stats">
<div class="stat"><span id="correctStat" class="stat-value">0</span><span class="stat-label">答对数</span></div>
<div class="stat"><span id="totalStat" class="stat-value">0</span><span class="stat-label">总题数</span></div>
<div class="stat"><span id="accuracyStat" class="stat-value">0%</span><span class="stat-label">正确率</span></div>
<div class="stat"><span id="skippedStat" class="stat-value">0</span><span class="stat-label">跳过数</span></div>
</div>
<button id="restartBtn" class="restart">重新开始本分类</button>
</section>
</div>
</section>
</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>

async function supabaseAuth(path,body){

 let data=null;try{data=await res.json()}catch(e){}
 if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||"请求失败");
 return data;
}

   if(await refreshSession()){res=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers:{...apiHeaders(currentSession.access_token),...(options.headers||{})}})}
 }
 if(!res.ok){let data=null;try{data=await res.json()}catch(e){}throw new Error(data?.message||data?.hint||data?.details||"数据库请求失败")}
 if(res.status===204)return null;return await res.json();
}

function calculateState(category,map){
 const items=WORD_DATA[category]||[];let idx=0,correct=0,skipped=0;
 for(let i=0;i<items.length;i++){const s=map.get(wordKey(category,items[i]));if(s==="correct"){correct++;idx=i+1}else if(s==="skipped"){skipped++;idx=i+1}else break}
 return{currentIndex:idx,correctCount:correct,skippedCount:skipped,completed:idx>=items.length};
}
async function loadState(category){

function normalizeMeaning(value){
 return String(value??"")
   .trim()
   .toLowerCase()
   .replace(/[\u0020\u3000，,。；;：:、/／|｜\-—_]+/g,"");
}

/*
 * 离线“宽松语义匹配”：
 * 浏览器单文件不能调用在线 AI/词典，所以这里采用三层判定：

 * 但语义明显相近的答案。

const meaningSynonymMap = new Map();
MEANING_SYNONYM_GROUPS.forEach(group=>{
 group.forEach(item=>{
   const key=normalizeMeaning(item);
   if(!key)return;
   if(!meaningSynonymMap.has(key)) meaningSynonymMap.set(key,new Set());
   group.forEach(other=>{
     const normalized=normalizeMeaning(other);
     if(normalized) meaningSynonymMap.get(key).add(normalized);
   });
 });
});

function levenshteinDistance(a,b){
 const m=a.length,n=b.length;
 if(!m)return n;
 if(!n)return m;
 let prev=Array.from({length:n+1},(_,i)=>i);
 for(let i=1;i<=m;i++){
   const cur=[i];
   for(let j=1;j<=n;j++){
     const cost=a[i-1]===b[j-1]?0:1;
     cur[j]=Math.min(
       cur[j-1]+1,
       prev[j]+1,
       prev[j-1]+cost
     );
   }
   prev=cur;
 }
 return prev[n];
}

function characterSimilarity(a,b){
 if(a===b)return 1;
 if(!a||!b)return 0;

 // 中文释义很短时，模糊匹配容易误判，因此 2~3 字只允许
 // 非常接近的编辑距离；4 字以上才启用更宽松的比例。
 const maxLen=Math.max(a.length,b.length);
 const distance=levenshteinDistance(a,b);
 return 1-distance/maxLen;
}

function isChineseText(value){
 return /[\u3400-\u9fff]/.test(value);
}

function meaningMatches(input,meanings){
 const normalized=normalizeMeaning(input);
 if(!normalized)return false;

 const normalizedMeanings=meanings
   .map(m=>normalizeMeaning(m))
   .filter(Boolean);

 // ① 标准化完全匹配
 if(normalizedMeanings.includes(normalized))return true;

 // ② 同义/近义词组匹配
 const inputGroup=meaningSynonymMap.get(normalized);
 if(inputGroup){
   for(const meaning of normalizedMeanings){
     if(inputGroup.has(meaning))return true;
   }
 }

 // ③ 保守模糊匹配：
 // 只针对中文释义；英文/数字等不进行模糊猜测。
 // 2~3 字：编辑距离必须 <= 1
 // 4 字及以上：相似度 >= 0.75 且长度差不能太大
 if(isChineseText(normalized)){
   for(const meaning of normalizedMeanings){
     if(!isChineseText(meaning))continue;
     const maxLen=Math.max(normalized.length,meaning.length);
     const minLen=Math.min(normalized.length,meaning.length);
     const similarity=characterSimilarity(normalized,meaning);

     if(maxLen<=3 && levenshteinDistance(normalized,meaning)<=1){
       return true;
     }

     if(maxLen>=4 && minLen>=3 &&
        Math.abs(normalized.length-meaning.length)<=2 &&
        similarity>=0.75){
       return true;
     }
   }
 }

 return false;
}

async function renderThemeCards(){
 themeGrid.innerHTML="";syncStatus.textContent="正在同步云端进度…";
 const categories=Object.keys(WORD_DATA);
 for(const category of categories){
  let state;try{state=await loadState(category)}catch(e){syncStatus.textContent="同步失败："+e.message;return}
  const total=WORD_DATA[category].length,finished=state.completed,studied=Math.min(state.currentIndex,total),unstudied=Math.max(total-studied,0),progressPercent=total?Math.round(studied/total*100):0,accuracy=studied?Math.round(state.correctCount/studied*100):0;
  const card=document.createElement("button");card.className="theme-card";card.type="button";
  card.innerHTML=`<div class="theme-icon">${ICONS[category]||"📚"}</div><h2>${escapeHtml(category)}</h2><p class="count">${total} 个词条</p><div class="theme-stats"><div class="theme-stat"><span class="theme-stat-value">${studied}</span><span class="theme-stat-label">已背</span></div><div class="theme-stat"><span class="theme-stat-value">${unstudied}</span><span class="theme-stat-label">未背</span></div><div class="theme-stat"><span class="theme-stat-value">${progressPercent}%</span><span class="theme-stat-label">进度</span></div><div class="theme-stat"><span class="theme-stat-value">${accuracy}%</span><span class="theme-stat-label">正确率</span></div></div><div class="theme-progress"><div class="theme-progress-bar" style="width:${progressPercent}%"></div></div><span class="saved-progress">${finished?"已完成 · 可重新开始":studied>0?"继续第 "+(studied+1)+" 题":"尚未开始"}</span><span class="start">${finished?"重新进入 →":"开始背诵 →"}</span>`;
  card.addEventListener("click",()=>openCategory(category));themeGrid.appendChild(card);
 }
 syncStatus.textContent="进度已同步到云端";
}

async function submitAnswer(){

 const item=WORD_DATA[currentCategory][currentIndex],posCorrect=posSelect.value===item.pos,meaningCorrect=meaningMatches(meaningInput.value,item.meaning);

  submitBtn.disabled=true;answerBtn.disabled=true;
  try{await saveWordProgress(currentCategory,item,"correct");correctCount++;currentIndex++;showToast("✓ 回答正确","success",1200);nextTimer=setTimeout(renderQuestion,1000)}catch(e){submitBtn.disabled=false;answerBtn.disabled=false;showToast("保存失败："+e.message,"error",1800)}
 }else showToast("失败：词性或意思不对，请重试","error",1200);
}
